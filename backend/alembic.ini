# Alembic config for CompanionOS.
#
# The DB lives on a volume at /app/data/companionos.db inside the container
# (and is the same path init_db() uses). To run migrations from inside the
# backend container:
#
#     alembic upgrade head
#
# To run from a host shell pointing at a different DB:
#
#     ALEMBIC_DATABASE_URL=sqlite:///./data/companionos.db alembic upgrade head

[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url = sqlite:////app/data/companionos.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
