services:
  backend:
    container_name: companionos-backend
    build:
      context: ./backend
    env_file:
      - ./backend/.env          # GEMINI_API_KEY and GEMINI_MODEL (gitignored)
    environment:
      - CHROMA_DATA_PATH=/app/data/chroma
    volumes:
      - app_data:/app/data
      - chroma_data:/app/data/chroma
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    container_name: companionos-frontend
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_BASE=http://localhost:8000
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  app_data:
  chroma_data:
